<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Forma · Senza connessione</title>
  <style>
    :root { color-scheme: dark light; --bg: #07080a; --text: #f4f5f7; --muted: #7f858f; --accent: #c6f432; --on-accent: #0b0d05; }
    @media (prefers-color-scheme: light) { :root { --bg: #f4f4f1; --text: #101214; --muted: #5f6570; } }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
    main { max-width: 320px; }
    h1 { font-size: 24px; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    button { appearance: none; border: 0; border-radius: 16px; padding: 14px 28px; font: 700 16px -apple-system, system-ui, sans-serif;
      background: var(--accent); color: var(--on-accent); }
  </style>
</head>
<body>
  <main>
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h.01" /><path d="M8.5 16.4a5 5 0 0 1 7 0" /><path d="M5 12.9a10 10 0 0 1 5.2-2.7" /><path d="M19 12.9a10 10 0 0 0-2.3-1.7" /><path d="M2 8.8a15 15 0 0 1 4.2-2.6" /><path d="M22 8.8a15 15 0 0 0-11.3-3.7" /><path d="m2 2 20 20" />
    </svg>
    <h1>Nessuna connessione</h1>
    <p>Forma si aggiorna dal sito e ha bisogno di internet per aprirsi. Controlla Wi-Fi o dati mobili e riprova.</p>
    <button onclick="location.href='https://jiren38.github.io/forma/'">Riprova</button>
  </main>
</body>
</html>
